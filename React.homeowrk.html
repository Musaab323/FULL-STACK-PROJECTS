<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Homework - Employee Record</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body style="padding: 20px;">

    <div id="root"></div>

    <script type="text/babel">
        function EmployeeRecord({ salary, position, company }) {
            const labelStyle = {
                color: 'red',
                fontWeight: 'bold'
            };

            return (
                <div style={{ fontFamily: 'Times New Roman, serif', fontSize: '18px', margin: '6px 0' }}>
                    <span style={labelStyle}>Salary:</span> {salary} -{' '}
                    <span style={labelStyle}>Position:</span> {position} -{' '}
                    <span style={labelStyle}>Company:</span> {company}
                </div>
            );
        }

        function App() {
            return (
                <div>
                    <EmployeeRecord
                        salary={90000}
                        position="Senior SDE"
                        company="Amazon"
                    />
                    <EmployeeRecord
                        salary={12000}
                        position="Junior SDE"
                        company="Google"
                    />
                    <EmployeeRecord
                        salary={10000}
                        position="Project Manager"
                        company="Netflix"
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body>

</html>
